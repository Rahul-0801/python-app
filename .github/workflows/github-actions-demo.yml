# CI for gcp cloud run

name: cloud-run

on:
    pull_request:
        branches:
        - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout-code
          uses: actions/checkout@v4

        - name: Setup python 3.12
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'

        - name: Install dependencies
          run: |
            pip install requirements.txt
        
        - name: Run unit test
          run: |
            pytest
        
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: checkout-code
          uses: actions/checkout@v4

        - name: Setup python 3.12
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'
        
        - name: Install Dependencies
          run: |
            pip install flake8
        
        - name: Run flake8
          run: |
            flake8 .
    
    docker:
        runs-on: ubuntu-latest
          
        needs: build

        env:
          PROJECT_ID: qea-sandbox
          REGION: us-central1                   # change as per your registry region
          REPOSITORY: cloudrun-repo              # artifact registry repo name
          IMAGE_NAME: cloudrun-app          # docker image name
         
                
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
                  
        - name: Set up Google Cloud authentication
          uses: google-github-actions/auth@v2
          with:
            credentials_json: ${{ secrets.GCP_SA_KEY }}

        - name: Configure Docker for Artifact Registry
          run: |
            gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

        - name: Build Docker image
          run: |
            docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} .

        - name: Push Docker image to Artifact Registry
          run: |
            docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}
        
    updateCloudRun:
        runs-on: ubuntu-latest

        needs: docker

        env:
          PROJECT_ID: qea-sandbox
          REGION: us-central1                   # change as per your registry region
          REPOSITORY: cloudrun-repo              # artifact registry repo name
          IMAGE_NAME: cloudrun-app          # docker image name
          SERVICE_NAME: cloudrun-service         # cloud run service name
         
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
                  
        - name: Set up Google Cloud authentication
          uses: google-github-actions/auth@v2
          with:
            credentials_json: ${{ secrets.GCP_SA_KEY }}

        - name: Deploy to Cloud Run
          run: |
            gcloud run deploy $SERVICE_NAME \
              --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
              --region $REGION \
              --platform managed \
              --allow-unauthenticated \
              --quiet
      
    